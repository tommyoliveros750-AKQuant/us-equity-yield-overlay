name: AK-System Autonomous Cloud Autopilot

on:
  schedule:
    - cron: '5 20 * * 1-5'
  workflow_dispatch:

jobs:
  run-autonomous-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Secure Repository Wires
        uses: actions/checkout@v4

      - name: Initialize Isolated Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Package Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy alpaca-trade-api urllib3 requests

      - name: Execute Cloud Closing Multi-Account Sweep
        env:
          MY_LIVE_LTD_KEY: ${{ secrets.MY_LIVE_LTD_KEY }}
          MY_LIVE_LTD_SECRET: ${{ secrets.MY_LIVE_LTD_SECRET }}
          CLIENT1_ACTIVE: "true"
          CLIENT1_STATUS: "ACTIVE"
          RISK_OVERRIDE_VICI: "LIFTED"
          SYSTEM_STATUS_FORCE: "RESUME"
        run: |
          cd adam_khoo_system
          python daily_routine.py --auto-close
          python ak_subscriber_broadcast.py --execute-pending
